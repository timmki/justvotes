spring:
  application:
    name: justvotes
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:/data/justvotes.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
      connection-init-sql: PRAGMA foreign_keys = ON; PRAGMA journal_mode = WAL; PRAGMA busy_timeout = 5000
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    connect-retries: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
server:
  forward-headers-strategy: framework
logging:
  config: classpath:logback-spring.xml

spring:
  application:
    name: justvotes
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:./data/justvotes.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
      connection-init-sql: PRAGMA foreign_keys = ON; PRAGMA journal_mode = WAL; PRAGMA busy_timeout = 5000
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    connect-retries: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
server:
  # Process the trusted proxy protocol at the Tomcat connector level. This is
  # early enough for Tomcat itself to create a Secure session cookie; a
  # DispatcherServlet filter can be too late because the container may append
  # JSESSIONID while committing the response.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        same-site: lax
logging:
  config: classpath:logback-spring.xml
justvotes:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}

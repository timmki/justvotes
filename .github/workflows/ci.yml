name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend and generate API client
        working-directory: frontend
        run: pnpm build
      - name: Typecheck, lint and unit test
        working-directory: frontend
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests and Axe checks
        working-directory: frontend
        run: pnpm test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests and contract generation
        run: mvn -s .mvn/settings.xml test
      - name: Typecheck generated contract client
        working-directory: api-contract/typescript-contract
        run: |
          npm ci
          npm run typecheck

  browser-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, edge, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Install browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps ${{ matrix.project == 'edge' && 'msedge' || matrix.project }}
      - name: Run browser tests
        working-directory: frontend
        run: pnpm exec playwright test --project=${{ matrix.project }}

  container:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            startup_attempts: 30
          - platform: linux/arm64
            arch: arm64
            startup_attempts: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        run: docker buildx build --platform "${{ matrix.platform }}" --tag "justvotes:ci-${{ matrix.arch }}" --load .

      - name: Start runtime image with temporary SQLite volume
        run: |
          docker volume create "justvotes-ci-data-${{ matrix.arch }}"
          docker run --detach --name "justvotes-ci-${{ matrix.arch }}" --publish 18080:8080 \
            --volume "justvotes-ci-data-${{ matrix.arch }}:/data" \
            --env ADMIN_USERNAME=admin \
            --env 'ADMIN_PASSWORD_HASH=$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy' \
            "justvotes:ci-${{ matrix.arch }}"

      - name: Smoke test SPA, API and probes
        run: |
          for attempt in $(seq 1 "${{ matrix.startup_attempts }}"); do
            curl --fail --silent http://127.0.0.1:18080/actuator/health/readiness && break
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/polls)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/v1/missing)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/actuator/health)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/actuator/health/readiness)" = 200
      - name: Show container logs on failure
        if: failure()
        run: docker logs "justvotes-ci-${{ matrix.arch }}"

      - name: Remove container and volume
        if: always()
        run: docker rm --force "justvotes-ci-${{ matrix.arch }}"; docker volume rm "justvotes-ci-data-${{ matrix.arch }}"

  container-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: container
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

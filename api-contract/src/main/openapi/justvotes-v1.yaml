openapi: 3.0.3
info:
  title: JustVotes API
  version: 1.0.0
  description: |
    The authoritative HTTP contract for JustVotes. Poll audit entries are intentionally public and detailed so every participant can verify voting activity; they contain the public identity and selected option.

    ## Cookie contract

    The browser client uses same-origin credentials (`credentials: "same-origin"`), so it sends and stores these cookies automatically. `userID` is the normalized identity value, valid for ten years, `Path=/`, `HttpOnly`, `SameSite=Lax`, and `Secure` when the effective external request protocol is HTTPS. JavaScript must not read or mirror it. `JSESSIONID` is a server-managed session cookie: `Path=/`, session lifetime, `HttpOnly`, `SameSite=Lax`, and `Secure` for effective external HTTPS. `XSRF-TOKEN` is a CSRF bootstrap cookie: `Path=/`, session lifetime, readable by JavaScript (`HttpOnly` absent/false), `SameSite=Lax`, and `Secure` for effective external HTTPS; the client reads it only to send the matching `X-XSRF-TOKEN` header. The application trusts forwarded protocol headers only after deployment behind its trusted proxy; direct untrusted forwarding headers must not be accepted.

    ## Session and CSRF flow

    1. `GET /csrf` first. It returns `{"token":"...","headerName":"X-XSRF-TOKEN"}` and sets the readable `XSRF-TOKEN` cookie. Keep that cookie and send the JSON token in the returned header name for every unsafe request below.
    2. `POST /admin/login` with that CSRF cookie/header pair and credentials. A successful response sets the server-side `JSESSIONID` session cookie. Keep `JSESSIONID` and `XSRF-TOKEN`; no bearer token or other client authentication is used.
    3. Send the CSRF cookie plus header for a public mutation (`POST /identity`, then `POST /polls/{pollId}/votes`); send the session cookie as well for admin mutations. `POST /identity` additionally sets the `userID` cookie used when voting.
    4. `POST /admin/logout` with both cookies and the CSRF header invalidates the server-side session.

    Unsafe requests with a missing or incorrect CSRF token receive `403` Problem Details. Admin requests without a valid `JSESSIONID` receive `401` Problem Details. A client can obtain a fresh token by calling `/csrf` again.
servers:
  - url: /api/v1
tags:
  - name: Session
  - name: Identity
  - name: Templates
  - name: Polls
  - name: Public polls
  - name: Administration
x-status-matrix:
  description: Central inventory used to reconcile operation responses and HTTP tests.
  statuses:
    '400': malformed JSON, bean validation, or invalid opaque identifier
    '401': missing or invalid administrator session, or invalid login credentials
    '403': missing/invalid CSRF token or insufficient permission
    '404': missing resource or unknown route
    '405': unsupported HTTP method
    '409': illegal poll transition, duplicate name, or conflicting state
    '415': unsupported request media type
  responseSchema: '#/components/schemas/Problem'
paths:
  /csrf:
    get:
      tags:
        - Session
      operationId: csrf
      responses:
        '200':
          description: CSRF bootstrap token. The response sets the readable `XSRF-TOKEN` cookie; send the JSON `token` in the JSON `headerName` on subsequent unsafe requests.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: XSRF-TOKEN CSRF cookie; Path=/, session lifetime, SameSite=Lax, Secure for effective HTTPS, HttpOnly=false. The same-origin browser client reads this cookie and sends its value in X-XSRF-TOKEN.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /admin/login:
    post:
      tags:
        - Session
      operationId: login
      security:
        - csrf: [ ]
          csrfCookie: [ ]
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        '204':
          description: Logged in; sets the server-side session cookie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: JSESSIONID session cookie; Path=/, session lifetime, SameSite=Lax, Secure for effective HTTPS, HttpOnly=true. Browser-managed; clients do not read or mirror it.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /admin/logout:
    post:
      tags:
        - Session
      operationId: logout
      security:
        - adminSession: [ ]
          csrf: [ ]
          csrfCookie: [ ]
      responses:
        '204':
          description: Logged out
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/session:
    get:
      tags:
        - Session
      operationId: session
      security:
        - adminSession: [ ]
      responses:
        '204':
          description: Active session
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Problem'

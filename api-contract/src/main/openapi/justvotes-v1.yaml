  '/polls/{pollId}/votes':
    parameters:
      - $ref: '#/components/parameters/PollId'
    post:
      tags:
        - Public polls
      operationId: castVote
      security:
        - voterIdentity: [ ]
          csrf: [ ]
          csrfCookie: [ ]
      requestBody:
        $ref: '#/components/requestBodies/Vote'
      responses:
        '403':
          $ref: '#/components/responses/Problem'
        '200':
          description: Vote recorded
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vote'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - Public polls
      operationId: withdrawVote
      security:
        - voterIdentity: [ ]
          csrf: [ ]
          csrfCookie: [ ]
      responses:
        '204':
          description: Vote withdrawn
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  '/polls/{pollId}/results':
    parameters:
      - $ref: '#/components/parameters/PollId'
    get:
      tags:
        - Public polls
      operationId: pollResults
      responses:
        '200':
          description: Current poll results
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResults'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  '/polls/{pollId}/audit':
    parameters:
      - $ref: '#/components/parameters/PollId'
    get:
      tags:
        - Public polls
      operationId: pollAudit
      responses:
        '200':
          description: Audit entries
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
        '404':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server-managed session cookie; Path=/, session lifetime, SameSite=Lax, HttpOnly=true, Secure for effective HTTPS. Sent automatically as same-origin credentials.
    voterIdentity:
      type: apiKey
      in: cookie
      name: userID
      description: Normalized identity cookie; ten-year lifetime, Path=/, SameSite=Lax, HttpOnly=true, Secure for effective HTTPS. Browser-managed and never readable by JavaScript.
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Send the token returned by `GET /csrf` in this header together with its `XSRF-TOKEN` cookie.
    csrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
      description: Path=/, session lifetime, SameSite=Lax, HttpOnly=false, Secure for effective HTTPS. JavaScript reads this cookie and sends the matching token in the X-XSRF-TOKEN header.
  parameters:
    PollId:
      name: pollId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PollId'
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GroupId'
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TemplateId'
    VoteId:
      name: voteId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/VoteId'
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number. Defaults to 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Number of entries per page. Defaults to 50; values from 1 through 100 are accepted.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Login'
    Identity:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Identity'
    Name:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Name'
    Group:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupInput'
    CreatePoll:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatePoll'
    Options:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Options'
    Expiry:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Expiry'
    Vote:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoteInput'
    DeleteConfirmation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteConfirmation'
    VoteRemoval:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoteRemoval'
  responses:
    Problem:
      description: Problem Details (RFC 9457). `code` is stable and suitable for machine handling; `detail` is diagnostic text.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Request is syntactically or semantically invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated caller is not allowed to perform this operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist (including invalid or opaque identifiers).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: HTTP method is not supported by this operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Domain state prevents this operation (for example an illegal poll lifecycle transition).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Request representation is not supported.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    NoStore:
      description: Response must not be stored or reused by browsers or intermediary caches.
      schema:
        type: string
        enum: [no-store]
  schemas:
    PollId:
      type: string
      pattern: '^p_v1_[A-Za-z0-9_-]+$'
    GroupId:
      type: string
      pattern: '^g_v1_[A-Za-z0-9_-]+$'
    TemplateId:
      type: string
      pattern: '^t_v1_[A-Za-z0-9_-]+$'
    VoteId:
      type: string
      pattern: '^v_v1_[A-Za-z0-9_-]+$'
    CsrfToken:
      type: object
      additionalProperties: false
      required:
        - token
        - headerName
      properties:
        token:
          type: string
        headerName:
          type: string
    Login:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    Identity:
      type: object
      additionalProperties: false
      required:
        - userID
      properties:
        userID:
          type: string
          pattern: '^\s*[A-Za-z0-9_-]{3,32}\s*$'
    CurrentIdentity:
      type: object
      additionalProperties: false
      required:
        - userID
      properties:
        userID:
          type: string
          nullable: true
          pattern: '^[a-z0-9_-]{3,32}$'
    Name:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '.*\S.*'
    GroupInput:
      type: object
      additionalProperties: false
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          maxLength: 1_000
    CreatePoll:
      type: object
      additionalProperties: false
      required:
        - title
        - templateGroupId
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
        templateGroupId:
          $ref: '#/components/schemas/GroupId'
    Options:
      type: object
      additionalProperties: false
      required:
        - optionTexts
      properties:
        optionTexts:
          type: array
          minItems: 2
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 120
            pattern: '.*\S.*'
    Expiry:
      type: object
      additionalProperties: false
      required:
        - endsAt
      properties:
        endsAt:
          type: string
          format: date-time
          description: UTC timestamp with millisecond precision, for example 2026-08-18T12:00:00.000Z.
    VoteInput:
      type: object
      additionalProperties: false
      required:
        - optionNumber
      properties:
        optionNumber:
          type: integer
          minimum: 1
    DeleteConfirmation:
      type: object
      additionalProperties: false
      required:
        - confirmation
      properties:
        confirmation:
          type: string
          enum:
            - DELETE
    VoteRemoval:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1_000
          pattern: '.*\S.*'
          description: Required removal reason. The server trims leading and trailing whitespace before validating it.
    AdminVotePage:
      type: object
      additionalProperties: false
      required:
        - votes
        - page
        - size
        - totalElements
      properties:
        votes:
          type: array
          items:
            $ref: '#/components/schemas/AdminVote'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
    AdminVote:
      type: object
      additionalProperties: false
      required:
        - voteId
        - userID
        - votedAt
        - poll
        - option
      properties:
        voteId:
          $ref: '#/components/schemas/VoteId'
        userID:
          type: string
          pattern: '^[a-z0-9_-]{3,32}$'
        votedAt:
          type: string
          format: date-time
        poll:
          $ref: '#/components/schemas/AdminVotePoll'
        option:
          $ref: '#/components/schemas/Option'
    AdminVotePoll:
      type: object
      additionalProperties: false
      required:
        - id
        - title
      properties:
        id:
          $ref: '#/components/schemas/PollId'
        title:
          type: string
    Template:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/TemplateId'
        name:
          type: string
    TemplateGroup:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
      properties:
        id:
          $ref: '#/components/schemas/GroupId'
        name:
          type: string
        description:
          type: string
    Poll:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - visibility
        - state
        - createdAt
        - endsAt
        - totalVotes
        - templateGroup
        - templateSnapshotOptions
        - options
      properties:
        id:
          $ref: '#/components/schemas/PollId'
        title:
          type: string
        visibility:
          type: string
        state:
          type: string
        createdAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        totalVotes:
          type: integer
          minimum: 0
        templateGroup:
          $ref: '#/components/schemas/TemplateGroup'
        templateSnapshotOptions:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
    Option:
      type: object
      additionalProperties: false
      required:
        - number
        - text
      properties:
        number:
          type: integer
          minimum: 1
        text:
          type: string
    Vote:
      type: object
      additionalProperties: false
      required:
        - status
        - optionNumber
      properties:
        status:
          type: string
        optionNumber:
          type: integer
    PollResults:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - visibility
        - state
        - createdAt
        - endsAt
        - totalVotes
        - options
      properties:
        id:
          $ref: '#/components/schemas/PollId'
        title:
          type: string
        visibility:
          type: string
        state:
          type: string
        createdAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        totalVotes:
          type: integer
          minimum: 0
        options:
          type: array
          items:
            $ref: '#/components/schemas/ResultOption'
    ResultOption:
      type: object
      additionalProperties: false
      required:
        - number
        - text
        - voteCount
        - votes
      properties:
        number:
          type: integer
          minimum: 1
        text:
          type: string
        voteCount:
          type: integer
          minimum: 0
        votes:
          type: array
          items:
            $ref: '#/components/schemas/ResultVote'
    ResultVote:
      type: object
      additionalProperties: false
      required:
        - userID
        - votedAt
      properties:
        userID:
          type: string
          pattern: '^[a-z0-9_-]{3,32}$'
        votedAt:
          type: string
          format: date-time
    AuditEntry:
      type: object
      additionalProperties: false
      required:
        - actor
        - occurredAt
        - event
      properties:
        actor:
          type: string
        occurredAt:
          type: string
          format: date-time
        event:
          type: string
        selection:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        userID:
          type: string
          nullable: true
          pattern: '^[a-z0-9_-]{3,32}$'
        optionNumber:
          type: integer
          nullable: true
          minimum: 1
        votedAt:
          type: string
          format: date-time
          nullable: true
    Problem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string

openapi: 3.0.3
info:
  title: JustVotes API
  version: 2.0.0
  description: |
    The authoritative HTTP contract for JustVotes. Every operation except the CSRF bootstrap, the login and the invitation endpoints requires a signed-in account. Poll audit entries are detailed so every signed-in participant can verify voting activity; they contain the identity and selected option.

    ## Cookie contract

    The browser client uses same-origin credentials (`credentials: "same-origin"`), so it sends and stores these cookies automatically. `JSESSIONID` is a server-managed session cookie: `Path=/`, session lifetime, `HttpOnly`, `SameSite=Lax`, and `Secure` for effective external HTTPS. Sessions end after 30 minutes without activity and at the latest 12 hours after login. `XSRF-TOKEN` is a CSRF bootstrap cookie: `Path=/`, session lifetime, readable by JavaScript (`HttpOnly` absent/false), `SameSite=Lax`, and `Secure` for effective external HTTPS; the client reads it only to send the matching `X-XSRF-TOKEN` header. The former `userID` identity cookie is no longer used; a successful login deletes it. The application trusts forwarded protocol headers only after deployment behind its trusted proxy; direct untrusted forwarding headers must not be accepted.

    ## Session and CSRF flow

    1. `GET /csrf` first. It returns `{"token":"...","headerName":"X-XSRF-TOKEN"}` and sets the readable `XSRF-TOKEN` cookie. Keep that cookie and send the JSON token in the returned header name for every unsafe request below.
    2. `POST /session/login` with that CSRF cookie/header pair and the account credentials. Every account, including the administrator, signs in this way. A successful response rotates and sets the server-side `JSESSIONID` session cookie. No bearer token or other client authentication is used.
    3. Accounts with role `user` use `/polls/**` and `/identity/votes`; votes are always recorded for the account's fixed identity. The account with role `admin` uses `/admin/**`. Send the CSRF cookie plus header for every unsafe request.
    4. `POST /session/logout` with the session cookie and the CSRF header invalidates the server-side session.

    Unsafe requests with a missing or incorrect CSRF token receive `403` Problem Details. Requests without a valid session receive `401` Problem Details; requests for another role receive `403` with code `access-denied`. An account with a pending one-time password receives `403` with code `password-change-required` for everything except `/session/**` until it sets its own password. A client can obtain a fresh token by calling `/csrf` again.
servers:
  - url: /api/v1
security:
  - session: [ ]
tags:
  - name: Session
  - name: Invitations
  - name: Identity
  - name: Templates
  - name: Polls
  - name: Public polls
  - name: Administration
  - name: Account administration
  - name: Invitation administration
x-status-matrix:
  description: Central inventory used to reconcile operation responses and HTTP tests.
  statuses:
    '400': malformed JSON, bean validation, or invalid opaque identifier
    '401': missing, expired or invalidated session (`authentication-required`), or invalid login credentials (`invalid-credentials`)
    '403': missing/invalid CSRF token, insufficient role (`access-denied`), or pending password change (`password-change-required`)
    '404': missing resource or unknown route
    '405': unsupported HTTP method
    '409': illegal poll transition, duplicate name, conflicting state, or account and invitation conflicts (`account-name-taken`, `identity-taken`, `email-already-invited`, `invitation-not-usable`, `invitation-delivery-unavailable`, `account-not-manageable`, `already-authenticated`)
    '415': unsupported request media type
    '422': password rejected (`password-policy-violation`, `current-password-invalid`)
    '429': too many failed logins for an account name (`login-throttled`), with `Retry-After`
  responseSchema: '#/components/schemas/Problem'
paths:
  /csrf:
    get:
      tags:
        - Session
      operationId: csrf
      security: [ ]
      responses:
        '200':
          description: CSRF bootstrap token. The response sets the readable `XSRF-TOKEN` cookie; send the JSON `token` in the JSON `headerName` on subsequent unsafe requests.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: XSRF-TOKEN CSRF cookie; Path=/, session lifetime, SameSite=Lax, Secure for effective HTTPS, HttpOnly=false. The same-origin browser client reads this cookie and sends its value in X-XSRF-TOKEN.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /session/login:
    post:
      tags:
        - Session
      operationId: login
      security:
        - csrf: [ ]
          csrfCookie: [ ]
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        '200':
          description: Signed in; rotates and sets the server-side session cookie and deletes a legacy `userID` cookie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: JSESSIONID session cookie; Path=/, session lifetime, SameSite=Lax, Secure for effective HTTPS, HttpOnly=true. Browser-managed; clients do not read or mirror it.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /session:
    get:
      tags:
        - Session
      operationId: currentSession
      responses:
        '200':
          description: The signed-in account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /session/logout:
    post:
      tags:
        - Session
      operationId: logout
      security:
        - session: [ ]
          csrf: [ ]
          csrfCookie: [ ]
      responses:
        '204':
          description: Logged out
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /session/password:
    put:
      tags:
        - Session
      operationId: changePassword
      security:
        - session: [ ]
          csrf: [ ]
          csrfCookie: [ ]
      requestBody:
        $ref: '#/components/requestBodies/PasswordChange'
      responses:
        '204':
          description: Password changed. The current session stays valid; all other sessions of the account end.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /invitations/inspection:
    post:
      tags:
        - Invitations
      operationId: inspectInvitation
      description: Available without a session. The token comes from the fragment of the invitation link and is sent in the body so it never appears in URLs.
      security:
        - csrf: [ ]
          csrfCookie: [ ]
      requestBody:
        $ref: '#/components/requestBodies/InvitationTokenRequest'
      responses:
        '200':
          description: The invitation is usable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /invitations/acceptance:
    post:
      tags:
        - Invitations
      operationId: acceptInvitation
      description: Available without a session. Creates a user account with the chosen account name, fixed identity and password and signs it in. Rejected with `already-authenticated` while a session exists.
      security:
        - csrf: [ ]
          csrfCookie: [ ]
      requestBody:
        $ref: '#/components/requestBodies/InvitationAcceptance'
      responses:
        '200':
          description: Account created and signed in; sets the session cookie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /identity/votes:
    get:
      tags:
        - Identity
      operationId: currentIdentityVotes
      description: Requires role `user`. Uses only the fixed identity of the signed-in account. Entries are ordered by votedAt descending, then opaque poll ID ascending.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Current personal votes of the signed-in account's identity.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentIdentityVotes'
  /admin/template-catalog/templates:
    get:
      tags:

      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Public polls ordered by creation time ascending, then opaque poll ID ascending.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Poll'
  '/polls/{pollId}':
    parameters:
      - $ref: '#/components/parameters/PollId'
    get:
      tags:
        - Public polls
      operationId: publicPoll
      description: Requires role `user`.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Poll
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
        '404':
          $ref: '#/components/responses/Problem'
  '/polls/{pollId}/votes':
    parameters:
      - $ref: '#/components/parameters/PollId'
    post:
      tags:
        - Public polls
      operationId: castVote
      description: Requires role `user`.
      security:
        - session: [ ]
          csrf: [ ]
          csrfCookie: [ ]
      requestBody:
        $ref: '#/components/requestBodies/Vote'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '200':
          description: Vote recorded
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vote'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - Public polls
      operationId: withdrawVote
      description: Requires role `user`.
      security:
        - session: [ ]
          csrf: [ ]
          csrfCookie: [ ]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '204':
          description: Vote withdrawn
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  '/polls/{pollId}/results':
    parameters:
      - $ref: '#/components/parameters/PollId'
    get:
      tags:
        - Public polls
      operationId: pollResults
      description: Requires role `user`.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Current poll results with options ordered by stable option number and votes ordered by votedAt ascending, then public identity ascending.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResults'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  '/polls/{pollId}/audit':
    parameters:
      - $ref: '#/components/parameters/PollId'
    get:
      tags:
        - Public polls
      operationId: pollAudit
      description: Requires role `user`.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Audit entries ordered chronologically by occurredAt ascending, then by the persisted audit sequence.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
        '404':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server-managed session cookie of the signed-in account; Path=/, session lifetime, SameSite=Lax, HttpOnly=true, Secure for effective HTTPS. Sent automatically as same-origin credentials.
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Send the token returned by `GET /csrf` in this header together with its `XSRF-TOKEN` cookie.
    csrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
      description: Path=/, session lifetime, SameSite=Lax, HttpOnly=false, Secure for effective HTTPS. JavaScript reads this cookie and sends the matching token in the X-XSRF-TOKEN header.
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccountId'
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/InvitationId'
    PollId:
      name: pollId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PollId'
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GroupId'
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TemplateId'
    VoteId:
      name: voteId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/VoteId'
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number. Defaults to 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Number of entries per page. Defaults to 50; values from 1 through 100 are accepted.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Login'
    PasswordChange:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordChange'
    InvitationTokenRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationTokenRequest'
    InvitationAcceptance:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationAcceptance'
    InvitationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationRequest'
    Name:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Name'
    Group:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupInput'
    CreatePoll:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatePoll'
    Options:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Options'
    Expiry:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Expiry'
    Vote:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoteInput'
    DeleteConfirmation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteConfirmation'
    VoteRemoval:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoteRemoval'
  responses:
    Problem:
      description: Problem Details (RFC 9457). `code` is stable and suitable for machine handling; `detail` is diagnostic text.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Request is syntactically or semantically invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated caller is not allowed to perform this operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist (including invalid or opaque identifiers).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: HTTP method is not supported by this operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Domain state prevents this operation (for example an illegal poll lifecycle transition).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The password was rejected (`password-policy-violation` or `current-password-invalid`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many failed logins for this account name (`login-throttled`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          description: Seconds until the next login attempt is accepted.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Request representation is not supported.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    NoStore:
      description: Response must not be stored or reused by browsers or intermediary caches.
      schema:
        type: string
        enum: [ no-store ]
  schemas:
    UtcTimestamp:
      type: string
      format: date-time
      description: RFC3339 timestamp serialized in UTC with a `Z` offset and millisecond precision.
      example: 2026-08-18T12:00:00.000Z
    NullableUtcTimestamp:
      type: string
      format: date-time
      nullable: true
      description: RFC3339 timestamp serialized in UTC with a `Z` offset and millisecond precision, or null when no timestamp exists.
      example: 2026-08-18T12:00:00.000Z
    PollVisibility:
      type: string
      description: Whether a poll is visible to public participants.
      enum:
        - private
        - public
    PollState:
      type: string
      description: Current lifecycle state of a poll.
      enum:
        - draft
        - active
        - expired
        - archived
        - deleted
    VoteStatus:
      type: string
      description: Result of casting or replacing the current vote.
      enum:
        - created
        - replaced
        - unchanged
    AuditEventType:
      type: string
      description: Known public poll audit event types.
      enum:
        - PollPublished
        - PollExpired
        - PollArchived
        - PollRestoredFromArchive
        - PollExpiryChanged
        - PollReopened
        - PollSoftDeleted
        - PollRestored
        - VoteCast
        - VoteReplaced
        - VoteWithdrawn
        - VoteRemovedByAdmin
    PollAuditEventType:
      type: string
      description: Poll lifecycle events in the public poll audit.
      enum:
        - PollPublished
        - PollExpired
        - PollArchived
        - PollRestoredFromArchive
        - PollExpiryChanged
        - PollReopened
        - PollSoftDeleted
        - PollRestored
    VoteAuditEventType:
      type: string
      description: Vote events in the public poll audit.
      enum:
        - VoteCast
        - VoteReplaced
        - VoteWithdrawn
        - VoteRemovedByAdmin
    PollId:
      type: string
      pattern: '^p_v1_[A-Za-z0-9_-]+$'
    GroupId:
      type: string
      pattern: '^g_v1_[A-Za-z0-9_-]+$'
    TemplateId:
      type: string
      pattern: '^t_v1_[A-Za-z0-9_-]+$'
    VoteId:
      type: string
      pattern: '^v_v1_[A-Za-z0-9_-]+$'
    CsrfToken:
      type: object
      additionalProperties: false
      required:
        - token
        - headerName
      properties:
        token:
          type: string
        headerName:
          type: string
    Login:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    AccountId:
      type: string
      pattern: '^a_v1_[A-Za-z0-9_-]+$'
    InvitationId:
      type: string
      pattern: '^i_v1_[A-Za-z0-9_-]+$'
    AccountRole:
      type: string
      enum:
        - user
        - admin
    CurrentSession:
      type: object
      additionalProperties: false
      required: [accountName, role, passwordChangeRequired]
      properties:
        accountName:
          type: string
        role:
          $ref: '#/components/schemas/AccountRole'
        identity:
          type: string
          nullable: true
          description: The fixed identity of a user account; null for the administrator.
        passwordChangeRequired:
          type: boolean
          description: True after a one-time password; everything except `/session/**` is rejected until the account sets its own password.
    PasswordChange:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          description: 12 to 128 Unicode code points, not only whitespace, different from the current password.
          minLength: 1
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [email, expiresAt]
      properties:
        email:
          type: string
        expiresAt:
          $ref: '#/components/schemas/UtcTimestamp'
    InvitationAcceptance:
      type: object
      additionalProperties: false
      required: [token, username, userID, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
        username:
          type: string
          description: 3 to 32 characters from `A-Z a-z 0-9 . _ -`, not only digits; unique ignoring case.
          minLength: 1
        userID:
          type: string
          description: The fixed identity, 1 to 64 Unicode code points without surrounding whitespace; unique ignoring case.
          minLength: 1
        password:
          type: string
          description: 12 to 128 Unicode code points, not only whitespace.
          minLength: 1
    InvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        locale:
          type: string
          enum: [de, en]
          description: Language of the invitation email; defaults to `de`.
    InvitationStatus:
      type: string
      enum: [open, expired, accepted, revoked]
    InvitationSummary:
      type: object
      additionalProperties: false
      required: [invitationId, email, status, deliveryFailed, issuedAt, expiresAt]
      properties:
        invitationId:
          $ref: '#/components/schemas/InvitationId'
        email:
          type: string
        status:
          $ref: '#/components/schemas/InvitationStatus'
        deliveryFailed:
          type: boolean
        issuedAt:
          $ref: '#/components/schemas/UtcTimestamp'
        expiresAt:
          $ref: '#/components/schemas/UtcTimestamp'
    AccountStatus:
      type: string
      enum: [active, locked]
    AccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, accountName, role, status, passwordChangeRequired, createdAt]
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId'
        accountName:
          type: string
        role:
          $ref: '#/components/schemas/AccountRole'
        identity:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AccountStatus'
        passwordChangeRequired:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/UtcTimestamp'
    OneTimePassword:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
    CurrentIdentityVotes:
      type: object
      additionalProperties: false
      required: [userID, votes]
      properties:
        userID:
          type: string
          description: The fixed identity of the signed-in account.
        votes:
          type: array
          items:
            $ref: '#/components/schemas/PersonalVote'
    PersonalVote:
      type: object
      additionalProperties: false
      required: [poll, option, votedAt]
      properties:
        poll:
          $ref: '#/components/schemas/PersonalVotePoll'
        option:
          $ref: '#/components/schemas/Option'
        votedAt:
          $ref: '#/components/schemas/UtcTimestamp'
    PersonalVotePoll:
      type: object
      additionalProperties: false
      required: [id, title, state]
      properties:
        id:
          $ref: '#/components/schemas/PollId'
        title:
          type: string
        state:
          type: string
          enum: [active, expired, archived]
    Name:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '.*\S.*'
    GroupInput:
      type: object
      additionalProperties: false
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          maxLength: 1_000
    CreatePoll:
      type: object
      additionalProperties: false
      required:
        - title
        - templateGroupId
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
        templateGroupId:
          $ref: '#/components/schemas/GroupId'
    Options:
      type: object
      additionalProperties: false
      required:
        - optionTexts
      properties:
        optionTexts:
          type: array
          minItems: 2
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 120
            pattern: '.*\S.*'
    Expiry:
      type: object
      additionalProperties: false
      required:
        - endsAt
      properties:
        endsAt:
          $ref: '#/components/schemas/UtcTimestamp'
    VoteInput:
      type: object
      additionalProperties: false
      required:
        - optionNumber
      properties:
        optionNumber:
          type: integer
          minimum: 1
    DeleteConfirmation:
      type: object
      additionalProperties: false
      required:
        - confirmation
      properties:
        confirmation:
          type: string
          enum:
            - DELETE
    VoteRemoval:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1_000
          pattern: '.*\S.*'
          description: Required removal reason. The server trims leading and trailing whitespace before validating it.
    AdminVotePage:
      type: object
      additionalProperties: false
      required:
        - votes
        - page
        - size
        - totalElements
      properties:
        votes:
          type: array
          items:
            $ref: '#/components/schemas/AdminVote'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
    AdminVote:
      type: object
      additionalProperties: false
      required:
        - voteId
        - userID
        - votedAt
        - poll
        - option
      properties:
        voteId:
          $ref: '#/components/schemas/VoteId'
        userID:
          type: string
          pattern: '^[a-z0-9_-]{3,32}$'
        votedAt:
          $ref: '#/components/schemas/UtcTimestamp'
        poll:
          $ref: '#/components/schemas/AdminVotePoll'
        option:
          $ref: '#/components/schemas/Option'
    AdminVotePoll:
      type: object
      additionalProperties: false
      required:
        - id
        - title
      properties:
        id:
          $ref: '#/components/schemas/PollId'
        title:
          type: string
    Template:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/TemplateId'
        name:
          type: string
    TemplateGroup:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
      properties:
        id:
          $ref: '#/components/schemas/GroupId'
        name:
          type: string
        description:
          type: string
    Poll:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - visibility
        - state
        - createdAt
        - endsAt
        - totalVotes
        - templateGroup
        - templateSnapshotOptions
        - options
      properties:
        id:
          $ref: '#/components/schemas/PollId'
        title:
          type: string
        visibility:
          $ref: '#/components/schemas/PollVisibility'
        state:
          $ref: '#/components/schemas/PollState'
        createdAt:
          $ref: '#/components/schemas/UtcTimestamp'
        endsAt:
          $ref: '#/components/schemas/NullableUtcTimestamp'
        totalVotes:
          type: integer
          minimum: 0
        templateGroup:
          $ref: '#/components/schemas/TemplateGroup'
        templateSnapshotOptions:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
    Option:
      type: object
      additionalProperties: false
      required:
        - number
        - text
      properties:
        number:
          type: integer
          minimum: 1
        text:
          type: string
    Vote:
      type: object
      additionalProperties: false
      required:
        - status
        - optionNumber
      properties:
        status:
          $ref: '#/components/schemas/VoteStatus'
        optionNumber:
          type: integer
    PollResults:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - visibility
        - state
        - createdAt
        - endsAt
        - totalVotes
        - options
      properties:
        id:
          $ref: '#/components/schemas/PollId'
        title:
          type: string
        visibility:
          $ref: '#/components/schemas/PollVisibility'
        state:
          $ref: '#/components/schemas/PollState'
        createdAt:
          $ref: '#/components/schemas/UtcTimestamp'
        endsAt:
          $ref: '#/components/schemas/NullableUtcTimestamp'
        totalVotes:
          type: integer
          minimum: 0
        options:
          type: array
          items:
            $ref: '#/components/schemas/ResultOption'
    ResultOption:
      type: object
      additionalProperties: false
      required:
        - number
        - text
        - voteCount
        - votes
      properties:
        number:
          type: integer
          minimum: 1
        text:
          type: string
        voteCount:
          type: integer
          minimum: 0
        votes:
          type: array
          items:
            $ref: '#/components/schemas/ResultVote'
    ResultVote:
      type: object
      additionalProperties: false
      required:
        - userID
        - votedAt
      properties:
        userID:
          type: string
          pattern: '^[a-z0-9_-]{3,32}$'
        votedAt:
          $ref: '#/components/schemas/UtcTimestamp'
    AuditEntry:
      oneOf:
        - $ref: '#/components/schemas/PollAuditEntry'
        - $ref: '#/components/schemas/VoteAuditEntry'
      required:
        - event
      properties:
        event:
          $ref: '#/components/schemas/AuditEventType'
    AuditEntryBase:
      type: object
      required:
        - actor
        - occurredAt
      properties:
        actor:
          type: string
        occurredAt:
          $ref: '#/components/schemas/UtcTimestamp'
        selection:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        userID:
          type: string
          nullable: true
          pattern: '^[a-z0-9_-]{3,32}$'
        optionNumber:
          type: integer
          nullable: true
          minimum: 1
        votedAt:
          $ref: '#/components/schemas/NullableUtcTimestamp'
    PollAuditEntry:
      allOf:
        - $ref: '#/components/schemas/AuditEntryBase'
        - type: object
          required:
            - event
          properties:
            event:
              $ref: '#/components/schemas/PollAuditEventType'
    VoteAuditEntry:
      allOf:
        - $ref: '#/components/schemas/AuditEntryBase'
        - type: object
          required:
            - event
          properties:
            event:
              $ref: '#/components/schemas/VoteAuditEventType'
    Problem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string

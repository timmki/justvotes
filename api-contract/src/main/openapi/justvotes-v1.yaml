          csrfCookie: [ ]
      requestBody:
        $ref: '#/components/requestBodies/Identity'
      responses:
        '204':
          description: Identity changed; sets the normalized `userID` cookie used for voting; ten-year lifetime, Path=/, SameSite=Lax, HttpOnly=true, Secure for effective HTTPS. Browser-managed; clients do not read or mirror it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
